<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Forex Trading Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-200">
    <!-- Top Navbar -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold text-emerald-400">📈 FX Journal</span>
            </div>
            <div class="flex items-center space-x-4">
                <button id="themeToggle" class="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 text-sm">🌓 Theme</button>
                <button id="logoutBtn" class="bg-rose-600/20 text-rose-400 border border-rose-600/30 px-3 py-1.5 rounded-lg hover:bg-rose-600 hover:text-white transition text-sm font-medium">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- Summary Statistics Bar -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-slate-400 text-xs uppercase tracking-wider">Monthly P&L</p>
                <h3 id="statMonthlyPL" class="text-2xl font-bold mt-1 text-slate-100">$0.00</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-slate-400 text-xs uppercase tracking-wider">Win Rate</p>
                <h3 id="statWinRate" class="text-2xl font-bold mt-1 text-emerald-400">0%</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <p class="text-slate-400 text-xs uppercase tracking-wider">Total Trades</p>
                <h3 id="statTotalTrades" class="text-2xl font-bold mt-1 text-slate-100">0</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                <div>
                    <p class="text-slate-400 text-xs uppercase tracking-wider">Quick Action</p>
                    <button onclick="openTradeModal()" class="mt-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition">+ New Trade</button>
                </div>
            </div>
        </div>

        <!-- Controls & Filters -->
        <div class="flex flex-wrap justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl gap-4">
            <div class="flex items-center space-x-3">
                <button id="prevMonth" class="px-3 py-1 bg-slate-800 rounded hover:bg-slate-700 text-sm font-semibold cursor-pointer">&larr; Prev</button>
                <h2 id="currentMonthYear" class="text-lg font-bold w-48 text-center text-emerald-400">September 2026</h2>
                <button id="nextMonth" class="px-3 py-1 bg-slate-800 rounded hover:bg-slate-700 text-sm font-semibold cursor-pointer">Next &rarr;</button>
            </div>
            <div class="flex items-center space-x-2">
                <label class="text-sm text-slate-400">Filter Pair:</label>
                <select id="pairFilter" class="bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    <option value="ALL">All Pairs</option>
                    <option value="EUR/USD">EUR/USD</option>
                    <option value="GBP/USD">GBP/USD</option>
                    <option value="USD/JPY">USD/JPY</option>
                    <option value="XAU/USD">XAU/USD</option>
                </select>
            </div>
        </div>

        <!-- Calendar Grid Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <div class="grid grid-cols-7 bg-slate-800/50 text-center py-3 text-xs font-semibold text-slate-400 border-b border-slate-800">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-800 min-h-[500px]">
                <!-- Rendered Dynamically -->
            </div>
        </div>
    </main>

    <!-- New Trade Modal -->
    <div id="tradeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-xl font-bold text-emerald-400">Log New Trade</h3>
                <button onclick="closeTradeModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <form id="newTradeForm" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Currency Pair</label>
                        <select id="tradePair" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white">
                            <option value="EUR/USD">EUR/USD</option>
                            <option value="GBP/USD">GBP/USD</option>
                            <option value="USD/JPY">USD/JPY</option>
                            <option value="XAU/USD">XAU/USD</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Date & Time</label>
                        <input type="datetime-local" id="tradeDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Entry Price</label>
                        <input type="number" step="any" id="entryPrice" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Exit Price</label>
                        <input type="number" step="any" id="exitPrice" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Lot Size</label>
                        <input type="number" step="0.01" id="lotSize" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white" value="1.00">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Stop Loss (SL)</label>
                        <input type="number" step="any" id="stopLoss" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Take Profit (TP)</label>
                        <input type="number" step="any" id="takeProfit" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">P&L ($)</label>
                    <input type="number" step="any" id="tradePL" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-emerald-400 font-bold" placeholder="e.g. 150.50 or -45.00">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Trade Notes & Strategy</label>
                    <textarea id="tradeNotes" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white" placeholder="Setup details, psychological notes..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Chart Screenshot (URL or Image)</label>
                    <input type="text" id="tradeScreenshot" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white" placeholder="Paste image URL here">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition text-sm">Save Trade</button>
            </form>
        </div>
    </div>

    <!-- Day Details Modal -->
    <div id="dayDetailsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="dayDetailsTitle" class="text-xl font-bold text-emerald-400">Trades for Date</h3>
                <button onclick="closeDayModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <div id="dayTradesList" class="space-y-4">
                <!-- Dynamic Trade Cards -->
            </div>
        </div>
    </div>

    <!-- SCRIPT 1: PURE UI -->
    <script>
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if(document.documentElement.classList.contains('dark')) {
                document.body.className = "bg-slate-950 text-slate-100 min-h-screen transition-colors duration-200";
            } else {
                document.body.className = "bg-slate-50 text-slate-900 min-h-screen transition-colors duration-200";
            }
        });

        function openTradeModal(prefillDate = null) {
            document.getElementById('tradeModal').classList.remove('hidden');
            document.getElementById('tradeModal').classList.add('flex');
            
            if (typeof prefillDate === 'string') {
                document.getElementById('tradeDate').value = prefillDate + "T12:00";
            } else {
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('tradeDate').value = now.toISOString().slice(0,16);
            }
        }

        function closeTradeModal() {
            document.getElementById('tradeModal').classList.add('hidden');
            document.getElementById('tradeModal').classList.remove('flex');
        }

        function closeDayModal() {
            document.getElementById('dayDetailsModal').classList.add('hidden');
            document.getElementById('dayDetailsModal').classList.remove('flex');
        }
    </script>

    <!-- SCRIPT 2: FIREBASE & DATA LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firestore";
        import { firebaseConfig } from "./file.js";

        let app, auth, db, currentUser = null;
        let tradesData = [];
        
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth();

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                if (auth) await signOut(auth);
            } catch (error) {
                console.error("Logout Error:", error);
            } finally {
                window.location.href = 'index.html'; 
            }
        });

        // Attach Month Navigation Listeners Immediately
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentMonth--;
            if(currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
            updateStats();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentMonth++;
            if(currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
            updateStats();
        });

        document.getElementById('pairFilter').addEventListener('change', () => {
            renderCalendar();
            updateStats();
        });

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    fetchTrades();
                } else {
                    window.location.href = 'index.html';
                }
            });
        } catch (error) {
            console.error("Firebase connection error:", error);
        }

        async function fetchTrades() {
            if (!currentUser || !db) return;
            try {
                const q = query(collection(db, "trades"), where("uid", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                tradesData = [];
                querySnapshot.forEach((doc) => {
                    tradesData.push({ id: doc.id, ...doc.data() });
                });
                renderCalendar();
                updateStats();
            } catch (e) {
                console.error("Error fetching trades:", e);
            }
        }

        document.getElementById('newTradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !db) return;

            const entry = parseFloat(document.getElementById('entryPrice').value);
            const exit = parseFloat(document.getElementById('exitPrice').value);
            const sl = parseFloat(document.getElementById('stopLoss').value);
            const tp = parseFloat(document.getElementById('takeProfit').value);
            const risk = Math.abs(entry - sl);
            const reward = Math.abs(tp - entry);
            const rr = risk > 0 ? (reward / risk).toFixed(2) : "0.00";

            const newTrade = {
                uid: currentUser.uid,
                pair: document.getElementById('tradePair').value,
                date: document.getElementById('tradeDate').value,
                entry,
                exit,
                lotSize: parseFloat(document.getElementById('lotSize').value),
                stopLoss: sl,
                takeProfit: tp,
                pl: parseFloat(document.getElementById('tradePL').value),
                notes: document.getElementById('tradeNotes').value,
                screenshot: document.getElementById('tradeScreenshot').value,
                rr: rr + ":1",
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "trades"), newTrade);
                closeTradeModal();
                document.getElementById('newTradeForm').reset();
                fetchTrades();
            } catch (err) {
                console.error("Error adding trade:", err);
                alert("Failed to save trade to database.");
            }
        });

        function renderCalendar() {
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('currentMonthYear').textContent = monthNames[currentMonth] + " " + currentYear;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const filterPair = document.getElementById('pairFilter').value;

            for(let i = 0; i < firstDayIndex; i++) {
                const cell = document.createElement('div');
                cell.className = "bg-slate-900/40 p-2 min-h-[100px]";
                grid.appendChild(cell);
            }

            for(let day = 1; day <= totalDays; day++) {
                const dateStr = currentYear + "-" + String(currentMonth + 1).padStart(2, '0') + "-" + String(day).padStart(2, '0');
                const dayTrades = tradesData.filter(t => t.date.startsWith(dateStr) && (filterPair === 'ALL' || t.pair === filterPair));
                
                const dayPl = dayTrades.reduce((acc, t) => acc + t.pl, 0);
                let indicatorClass = "bg-slate-900";
                let textPlColor = "text-slate-400";
                if(dayTrades.length > 0) {
                    if(dayPl >= 0) {
                        indicatorClass = "bg-emerald-950/40 border-emerald-600/40";
                        textPlColor = "text-emerald-400 font-semibold";
                    } else {
                        indicatorClass = "bg-rose-950/40 border-rose-600/40";
                        textPlColor = "text-rose-400 font-semibold";
                    }
                }

                const cell = document.createElement('div');
                cell.className = "p-3 min-h-[100px] border border-slate-800/80 flex flex-col justify-between cursor-pointer hover:bg-slate-800/50 transition " + indicatorClass;
                
                const countText = dayTrades.length > 0 ? dayTrades.length + ' trade(s)' : '';
                const plDisplay = dayTrades.length > 0 ? (dayPl >= 0 ? '+$' + dayPl.toFixed(2) : '-$' + Math.abs(dayPl).toFixed(2)) : '';
                
                cell.innerHTML = '<div class="flex justify-between items-center text-xs"><span class="font-bold text-slate-300">' + day + '</span><span class="text-[10px] text-slate-500">' + countText + '</span></div><div class="my-auto text-center">' + (dayTrades.length ? '<span class="' + textPlColor + ' text-sm">' + plDisplay + '</span>' : '') + '</div>';
                
                cell.onclick = () => {
                    if (dayTrades.length > 0) {
                        showDayTrades(dateStr, dayTrades);
                    } else {
                        openTradeModal(dateStr);
                    }
                };
                grid.appendChild(cell);
            }
        }

        window.showDayTrades = function(dateStr, trades) {
            document.getElementById('dayDetailsTitle').textContent = "Trades on " + dateStr;
            const list = document.getElementById('dayTradesList');
            list.innerHTML = '';

            if(trades.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-sm py-4 text-center">No trades recorded on this date.</p>';
            } else {
                trades.forEach(t => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800/70 border border-slate-700/60 p-4 rounded-xl space-y-2";
                    
                    const plColorClass = t.pl >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    const notesSection = t.notes ? '<p class="text-xs text-slate-300 bg-slate-900/50 p-2 rounded"><strong>Notes:</strong> ' + t.notes + '</p>' : '';
                    const screenshotSection = t.screenshot ? '<a href="' + t.screenshot + '" target="_blank" class="text-xs text-indigo-400 underline block mt-1">View Chart Screenshot</a>' : '';

                    card.innerHTML = '<div class="flex justify-between items-center"><span class="font-bold text-emerald-400">' + t.pair + '</span><span class="' + plColorClass + ' font-bold">$' + t.pl.toFixed(2) + '</span></div><div class="grid grid-cols-2 gap-2 text-xs text-slate-300"><div>Entry: <span class="text-white">' + t.entry + '</span></div><div>Exit: <span class="text-white">' + t.exit + '</span></div><div>SL: <span class="text-white">' + t.stopLoss + '</span> | TP: <span class="text-white">' + t.takeProfit + '</span></div><div>RR: <span class="text-emerald-400">' + t.rr + '</span></div><div>Lots: <span class="text-white">' + t.lotSize + '</span></div></div>' + notesSection + screenshotSection;
                    
                    list.appendChild(card);
                });
            }
            document.getElementById('dayDetailsModal').classList.remove('hidden');
            document.getElementById('dayDetailsModal').classList.add('flex');
        }

        function updateStats() {
            const filterPair = document.getElementById('pairFilter').value;
            const monthTrades = tradesData.filter(t => {
                const d = new Date(t.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear && (filterPair === 'ALL' || t.pair === filterPair);
            });

            const totalPl = monthTrades.reduce((acc, t) => acc + t.pl, 0);
            const winning = monthTrades.filter(t => t.pl > 0).length;
            const winRate = monthTrades.length > 0 ? ((winning / monthTrades.length) * 100).toFixed(1) : 0;

            const plEl = document.getElementById('statMonthlyPL');
            plEl.textContent = (totalPl >= 0 ? '+' : '') + '$' + totalPl.toFixed(2);
            plEl.className = "text-2xl font-bold mt-1 " + (totalPl >= 0 ? 'text-emerald-400' : 'text-rose-400');

            document.getElementById('statWinRate').textContent = winRate + '%';
            document.getElementById('statTotalTrades').textContent = monthTrades.length;
        }

        // Initial render on page load
        renderCalendar();
    </script>
</body>
</html>
