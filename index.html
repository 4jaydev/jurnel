<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jurnel</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Login</h2>
        
        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Email</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="email" id="username" required placeholder="Enter your email">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-200">
                Login
            </button>
        </form>
    </div>

    <!-- Firebase Authentication Script Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { firebaseConfig } from "./file.js";

        console.log("Loaded Firebase Config:", firebaseConfig);

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        console.log("✅ Firebase initialized successfully");

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const userInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Connecting...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, userInput, passInput);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', userCredential.user.email);
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.textContent = "Invalid username or password.";
                errorMsg.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
