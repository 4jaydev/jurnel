<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Forex Trading Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-emerald-400 tracking-tight">📈 FX Journal</h1>
            <p class="text-slate-400 text-sm">Sign in to track your trading performance</p>
        </div>

        <!-- Login Form -->
        <form id="authForm" class="space-y-4" onsubmit="event.preventDefault();">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="trader@example.com">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="••••••••">
            </div>

            <!-- Error Message Box -->
            <p id="errorMessage" class="text-rose-400 text-xs text-center hidden"></p>

            <div class="pt-2 space-y-3">
                <button type="button" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition text-sm">
                    Sign In
                </button>
                
                <div class="relative flex items-center py-2">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink-0 mx-4 text-slate-500 text-xs">OR</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <button type="button" id="signupBtn" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-semibold py-2.5 rounded-lg transition text-sm">
                    Create New Account
                </button>
            </div>
        </form>
    </div>

    <!-- FIREBASE AUTHENTICATION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        
        // Securely import config from file.js
        import { firebaseConfig } from "./file.js";

        let app, auth;
        const errorMessageEl = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Initialize Firebase
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            console.log("Firebase initialized successfully");
        } catch (error) {
            console.error("Firebase init error:", error);
            showError("Cannot connect to database. Check Vercel environment variables.");
        }

        function showError(msg) {
            errorMessageEl.textContent = msg;
            errorMessageEl.classList.remove('hidden');
        }

        function hideError() {
            errorMessageEl.classList.add('hidden');
        }

        // Clear error message when typing
        emailInput.addEventListener('input', hideError);
        passwordInput.addEventListener('input', hideError);

        // ✅ Auth State Listener - Redirect after successful login
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log("✅ User logged in:", user.email);
                // Redirect to dashboard (change path as needed)
                window.location.href = "/dashboard.html";
            }
        });

        // ✅ Login Function with Loading State
        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if(!email || !password) {
                return showError("Please enter both email and password.");
            }

            try {
                loginBtn.disabled = true;
                loginBtn.textContent = "🔄 Signing in...";
                hideError();
                
                await signInWithEmailAndPassword(auth, email, password);
                // Auth state listener will handle redirect
                
            } catch (error) {
                console.error("Login error:", error);
                
                // User-friendly error messages
                if (error.code === 'auth/user-not-found') {
                    showError("No account found with this email.");
                } else if (error.code === 'auth/wrong-password') {
                    showError("Incorrect password.");
                } else if (error.code === 'auth/invalid-email') {
                    showError("Invalid email format.");
                } else if (error.code === 'auth/user-disabled') {
                    showError("This account has been disabled.");
                } else {
                    showError(error.message);
                }
                
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "Sign In";
            }
        });

        // ✅ Sign Up Function with Loading State
        signupBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if(!email || !password) {
                return showError("Please enter both email and password.");
            }
            
            if(password.length < 6) {
                return showError("Password must be at least 6 characters.");
            }

            try {
                signupBtn.disabled = true;
                signupBtn.textContent = "⏳ Creating account...";
                hideError();
                
                await createUserWithEmailAndPassword(auth, email, password);
                // Auth state listener will handle redirect
                
            } catch (error) {
                console.error("Sign up error:", error);
                
                // User-friendly error messages
                if (error.code === 'auth/email-already-in-use') {
                    showError("Email already in use. Try logging in.");
                } else if (error.code === 'auth/weak-password') {
                    showError("Password is too weak. Use at least 6 characters.");
                } else if (error.code === 'auth/invalid-email') {
                    showError("Invalid email format.");
                } else {
                    showError(error.message);
                }
                
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = "Create New Account";
            }
        });

        // Allow Enter key to submit
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });
    </script>
</body>
</html>
