<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { firebaseConfig } from "./file.js";

  console.log("Loaded Firebase Config:", firebaseConfig);

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  console.log("✅ Firebase initialized successfully");

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const userInput = document.getElementById('username').value.trim();
    const passInput = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');
    
    errorMsg.classList.add('hidden');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Connecting...';

    try {
      const userCredential = await signInWithEmailAndPassword(auth, userInput, passInput);
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('currentUser', userCredential.user.email);
      window.location.href = 'dashboard.html';
    } catch (error) {
      console.error("Login Error:", error);
      errorMsg.textContent = "Invalid username or password.";
      errorMsg.classList.remove('hidden');
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login';
    }
  });
</script>
